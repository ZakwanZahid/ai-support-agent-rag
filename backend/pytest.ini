[pytest]
# The test suite imports the application as `app.*`, but the `pytest` console
# script does not put the working directory on sys.path the way
# `python -m pytest` does. Without this, `cd backend && pytest` fails with
# "No module named 'app'" while `python -m pytest` succeeds — a difference
# that is easy to trip over and hard to diagnose.
pythonpath = .
testpaths = tests

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: rag_support_agent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_support_agent
    ports:
      - "5433:5432"
    volumes:
      - rag_support_agent_pgdata:/var/lib/postgresql/data

volumes:
  rag_support_agent_pgdata: